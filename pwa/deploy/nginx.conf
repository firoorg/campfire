# Campfire for Firo (web wallet) - example nginx server block.
#
# Requirements:
# - Its own origin (a dedicated host name). Never a shared origin such as
#   <user>.github.io: IndexedDB, the service worker and passkeys are per origin.
# - HTTPS (service workers, WebAuthn and the wss:// ElectrumX servers need a secure context).
# - The security headers below on EVERY response. COOP + COEP make the page
#   cross-origin isolated. tools/build.mjs fails if these lines drift from tools/headers.mjs.
# - Access-Control-Allow-Origin: * on the app's files, so this copy can also serve
#   updates to installs whose own address is gone.
# - connect-src names Firo's ElectrumX servers (wss, port 50004), the Ethereum
#   servers, CoinGecko's price path, Buy FIRO's and Sell FIRO's API paths and NEAR
#   Intents' API path.
#   A person's own ElectrumX server is added by the installed app's service worker
#   to the pages it serves, never here: these headers only cover the first load,
#   before the worker takes over.
#
# Replace wallet.example.org and the certificate paths, put dist/ at /srv/campfire-firo.
# After every deploy, check what the public address really serves (a CDN in front can change
# headers the build cannot see; it is read-only): node tools/check_deploy.mjs https://<address>/
# The map block belongs to the http context: as here, in a file nginx includes
# from http {} (conf.d/), next to the server block.

# Pages get the strict policy. The loader (sw-<hash>.js) is a worker: its own
# policy lets it fetch a signed update from another copy of the app when this
# address does not answer (it checks every byte before keeping it), and check a
# person's own Ethereum / BNB Chain server before it is saved (any https address,
# or a node on that device over http: localhost, 127.0.0.1).
map $uri $campfire_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' wss://electrumx.firo.org:50004 wss://electrumx01.firo.org:50004 wss://electrumx02.firo.org:50004 wss://electrumx03.firo.org:50004 https://eth2.stackwallet.com https://ethereum-rpc.publicnode.com https://eth.drpc.org https://rpc.mevblocker.io https://eth-mainnet.public.blastapi.io https://mainnet.gateway.tenderly.co https://eth.blockrazor.xyz https://bsc-dataseed.bnbchain.org https://bsc.nodereal.io https://bsc-dataseed1.defibit.io https://bsc-dataseed1.ninicoin.io https://1rpc.io/bnb https://bsc-mainnet.public.blastapi.io https://bsc.rpc.blxrbdn.com https://bsc.blockrazor.xyz https://api.coingecko.com/api/v3/simple/price https://buyfiro.app/api/v1/buy/ https://buyfiro.app/api/v1/sell/ https://1click.chaindefuser.com/v0/; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'";
    "~/sw(-[0-9a-f]+)?\.js$" "default-src 'none'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*";
}

server {
    listen 443 ssl;
    http2 on;
    server_name wallet.example.org;

    ssl_certificate     /etc/ssl/wallet.example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/wallet.example.org/privkey.pem;

    root /srv/campfire-firo;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $campfire_csp always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;

    # No access log of client IPs: a privacy wallet's host should not keep them.
    access_log off;

    # The whole table: a types block here replaces nginx's mime.types, it does not add to it.
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        application/wasm wasm;
        application/manifest+json webmanifest;
        image/png png;
        image/svg+xml svg;
        font/ttf ttf;
        text/plain txt sig;
        font/woff2 woff2;
        application/json jwk;
    }
    default_type application/octet-stream;
    # The same Content-Type the loader serves (tools/headers.mjs MIME): text types say UTF-8.
    charset utf-8;
    charset_types text/html text/css text/javascript text/plain;

    location = /_headers { return 404; }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
